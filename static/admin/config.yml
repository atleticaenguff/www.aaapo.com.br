      - file: "src/pages/index.md"
        label: "Home"
        name: "home"
        fields:
          - {
              label: "Template Key",
              name: "templateKey",
              widget: "hidden",
              default: "home-page",
            }
          - {
              label: SEO,
              name: seo,
              widget: object,
              fields:
                [
                  { label: "Meta Title", name: "meta_title", widget: string },
                  {
                    label: "Meta Description",
                    name: "meta_description",
                    widget: text,
                  },
                ],
            }
          - {
              label: Hero,
              name: hero,
              widget: object,
              fields:
                [
                  { label: "Title", name: "title", widget: string },
                  { label: "Subtitle", name: "subtitle", widget: text },
                  {
                    label: "Button",
                    name: button,
                    widget: object,
                    fields:
                      [
                        { label: "URL", name: "url", widget: string },
                        { label: "Title", name: "title", widget: string },
                      ],
                  },
                  {
                    label: "Video",
                    name: video,
