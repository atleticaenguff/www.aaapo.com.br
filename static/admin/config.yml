backend:
  name: git-gateway

media_folder: "static/images"
public_folder: "/images"

site_url: https://aaapo-v2.netlify.app

display_url: https://aaapo-v2.netlify.app

logo_url: https://aaapo-v2.netlify.app/images/logo.png

collections:
  - name: "pages"
    label: "Pages"
