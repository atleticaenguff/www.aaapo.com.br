backend:
  name: git-gateway
  branch: master

media_folder: static/images
public_folder: /images

site_url: https://aaapo-v2.netlify.app

logo_url: https://aaapo-v2.netlify.app/images/logo.png

collections:
  - name: "pages"
    label: "Pages"
    files:
      - file: "src/pages/index.md"
        label: "Home"
        name: "home"
        fields:
          - {
              label: "Template Key",
              name: "templateKey",
              widget: "hidden",
              default: "home-page",
            }
          - {
              label: SEO,
              name: seo,
              widget: object,
              fields:
                [
                  { label: "Meta Title", name: "meta_title", widget: string },
                  {
                    label: "Meta Description",
                    name: "meta_description",
                    widget: text,
                  },
                ],
            }
          - {
              label: Hero,
              name: hero,
              widget: object,
              fields:
                [
                  { label: "Title", name: "title", widget: string },
                  { label: "Subtitle", name: "subtitle", widget: text },
                  {
                    label: "Button",
                    name: button,
                    widget: object,
                    fields:
                      [
                        { label: "URL", name: "url", widget: string },
                        { label: "Title", name: "title", widget: string },
                      ],
                  },
                  {
                    label: "Video",
                    name: video,
